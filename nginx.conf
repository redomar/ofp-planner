server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static export: /settings is settings.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Content-hashed build assets never change
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # pdf.js worker is an ES module; nginx's mime.types lacks .mjs
    location ~ \.mjs$ {
        types { }
        default_type text/javascript;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff" always;
    }

    error_page 404 /404.html;
}

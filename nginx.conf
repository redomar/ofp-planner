server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static export: /settings is settings.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # The schedule snapshot. A refreshed copy written by the maintenance job into the
    # /live volume wins over the one baked into the image. The manifest is revalidated
    # on every visit; the other files are fetched with ?v=<generatedAt>, so they can be
    # cached for a long time.
    location /data/ {
        try_files /live$uri $uri =404;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
    }
    location = /data/manifest.json {
        try_files /live$uri $uri =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }
    # The volume itself is never served directly.
    location /live/ {
        return 404;
    }

    # Content-hashed build assets never change
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    error_page 404 /404.html;
}
